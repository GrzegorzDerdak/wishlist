name: Build and Tag

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build and Tag
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Build Go binary
      run: go build -v -o wishlist-api .

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: |
          wishlist-app:${{ github.sha }}
          wishlist-app:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Save Docker image
      run: docker save wishlist-app:${{ github.sha }} | gzip > wishlist-app-${{ github.sha }}.tar.gz

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v6
      with:
        name: wishlist-app-${{ github.sha }}
        path: wishlist-app-${{ github.sha }}.tar.gz